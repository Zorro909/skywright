[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "skywright"
version = "0.1.0"
description = "Runtime SDK for portable machine-learning training projects"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Zorro909" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "boto3>=1.40,<2",
  "brotli>=1.1,<2",
  "jsonschema[format]>=4.25,<5",
  "numpy>=2.2,<3",
  "pillow>=11,<13",
  "protobuf==7.36.0",
  "python-snappy>=0.7,<1",
  "safetensors>=0.6,<1",
  "tensorboard==2.21.0",
  "xxhash>=3.5,<4",
  "zstandard>=0.23,<1",
]

[project.scripts]
skywright-config = "skywright.configuration:main"
skywright-datasets = "skywright._dataset_cli:main"
skywright-metrics = "skywright.metrics:main"
skywright-runtime = "skywright._runtime:main"

[project.urls]
Repository = "https://github.com/Zorro909/skywright"

[dependency-groups]
dev = [
  "griffe>=1.9,<3",
  "hatchling==1.32.0",
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
  "tomli>=2,<3",
  "twine>=6.1,<8",
]
ml-test = [
  "numpy>=2.2,<3",
  "torch>=2.8,<3",
]

[tool.uv]
required-version = "==0.8.8"

[tool.uv.dependency-groups]
ml-test = { requires-python = ">=3.10,<3.15" }

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/skywright"]

[tool.hatch.build.targets.sdist]
include = [
  "/LICENSE",
  "/README.md",
  "/pyproject.toml",
  "/src/skywright",
]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
testpaths = [
  "tests/test_configuration_contract.py",
  "tests/test_dataset_cli.py",
  "tests/test_metric_contract.py",
  "tests/test_package.py",
  "tests/test_release.py",
  "tests/test_run_definition.py",
  "tests/test_run_store.py",
  "tests/test_run_store_system.py",
  "tests/test_training_process.py",
]
markers = [
  "system: installed-artifact tests that require a built wheel",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests", "hatch_build.py", "release_support.py"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
