<a class="skip-link" href="#content">Skip to main content</a>
<header>
  <a class="identity" routerLink="/" aria-label="Skywright overview">
    <span class="mark" aria-hidden="true">S</span>
    <h1>Skywright</h1>
  </a>
  <nav aria-label="Primary">
    <a
      routerLink="/"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      [routerLinkActiveOptions]="{ exact: true }"
      >Overview</a
    >
    <a
      routerLink="/about"
      routerLinkActive="active"
      ariaCurrentWhenActive="page"
      >About</a
    >
  </nav>
</header>
<main id="content" tabindex="-1">
  @if (unexpectedFailure.isActive()) {
    <section
      #unexpectedFailureRegion
      class="unexpected-failure"
      aria-labelledby="unexpected-failure-heading"
      role="alert"
      tabindex="-1"
    >
      <h2 id="unexpected-failure-heading">Something went wrong</h2>
      <p>
        This view encountered an unexpected application failure. No internal
        details are shown.
      </p>
      <button type="button" (click)="returnToOverview()">
        Return to Overview
      </button>
    </section>
  } @else {
    <router-outlet />
  }
</main>
<footer><p>Portable training, deliberate control.</p></footer>
