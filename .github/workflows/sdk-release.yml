name: Publish Python SDK

on:
  push:
    tags:
      - 'sdk-v*'

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate SDK release policy
    runs-on: ubuntu-24.04
    outputs:
      source_revision: ${{ steps.release.outputs.source_revision }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Fetch the publication authority
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Reject tags that do not satisfy the release contract
        id: release
        env:
          TAG: ${{ github.ref_name }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          python3 sdk/release_support.py validate \
            --tag "$TAG" \
            --main-ref origin/main \
            --expected-revision "$TAG_COMMIT" > release.json
          jq --raw-output '"source_revision=\(.source_revision)\nversion=\(.version)"' \
            release.json >> "$GITHUB_OUTPUT"
          scripts/quality identity \
            --event tag \
            --tested-revision "$TAG_COMMIT" \
            --tag-commit "$(git rev-parse "$TAG^{commit}")"

  publish:
    name: Publish verified SDK distributions
    needs: validate
    runs-on: ubuntu-24.04
    environment: sdk-release
    permissions:
      attestations: write
      contents: write
      id-token: write
    steps:
      - name: Check out the exact tag
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Fetch the publication authority
        run: git fetch --no-tags origin main:refs/remotes/origin/main
      - name: Set up primary Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.14'
      - name: Set up the locked Python toolchain
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.8.8'
          enable-cache: false
      - name: Revalidate the exact protected source
        env:
          SOURCE_REVISION: ${{ needs.validate.outputs.source_revision }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          python3 sdk/release_support.py validate \
            --tag "$TAG" \
            --main-ref origin/main \
            --expected-revision "$SOURCE_REVISION" > release.json
      - name: Build once and verify in release mode
        env:
          SKYWRIGHT_BUILD_MODE: release
          SKYWRIGHT_SOURCE_REVISION: ${{ needs.validate.outputs.source_revision }}
        run: |
          mkdir --parents release/distributions
          uv lock --project sdk --check
          sdk/scripts/check
          sdk/scripts/build-distributions release/distributions
          sdk/scripts/check-distributions release/distributions
          uv run --project sdk --locked pytest sdk/tests/system -m system \
            --junitxml sdk/target/test-results/release-system.xml \
            --artifact-dir release/distributions
          python3 sdk/release_support.py evidence \
            --release release.json \
            --artifact-dir release/distributions
          python3 sdk/release_support.py verify-handoff \
            --artifact-dir release/distributions
      - name: Retain release qualification reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: sdk-release-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Inspect immutable publication collisions
        id: collisions
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          pypi_status="$(curl --silent --show-error \
            --output pypi.json \
            --write-out '%{http_code}' \
            https://pypi.org/pypi/skywright/json)"
          if [[ "$pypi_status" == "404" ]]; then
            printf '{}\n' > pypi.json
          elif [[ "$pypi_status" != "200" ]]; then
            echo "PyPI project lookup failed with HTTP $pypi_status" >&2
            exit 1
          fi

          github_status="$(curl --silent --show-error \
            --header 'Accept: application/vnd.github+json' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output github-release.json \
            --write-out '%{http_code}' \
            "https://api.github.com/repos/$REPOSITORY/releases/tags/$TAG")"
          if [[ "$github_status" == "404" ]]; then
            printf '{}\n' > github-release.json
          elif [[ "$github_status" != "200" ]]; then
            echo "GitHub Release lookup failed with HTTP $github_status" >&2
            exit 1
          fi

          python3 sdk/release_support.py collisions \
            --artifact-dir release/distributions \
            --pypi-json pypi.json \
            --github-release-json github-release.json \
            --github-output "$GITHUB_OUTPUT"
          python3 sdk/release_support.py verify-handoff \
            --artifact-dir release/distributions
      - name: Separate publication evidence from distributions
        run: |
          mkdir --parents release/evidence
          find release/distributions -maxdepth 1 -type f \
            ! -name '*.whl' ! -name '*.tar.gz' \
            -exec mv --target-directory release/evidence {} +
      - name: Attest build provenance
        id: provenance
        if: steps.collisions.outputs.github != 'skip'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/distributions/*
      - name: Retain provenance evidence with the release
        if: steps.collisions.outputs.github != 'skip'
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: cp "$BUNDLE" release/evidence/provenance.intoto.jsonl
      - name: Attest the wheel SBOM
        id: wheel_sbom
        if: steps.collisions.outputs.github != 'skip'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/distributions/skywright-${{ needs.validate.outputs.version }}-py3-none-any.whl
          sbom-path: release/evidence/skywright-${{ needs.validate.outputs.version }}-py3-none-any.whl.spdx.json
      - name: Retain wheel SBOM attestation with the release
        if: steps.collisions.outputs.github != 'skip'
        env:
          BUNDLE: ${{ steps.wheel_sbom.outputs.bundle-path }}
        run: cp "$BUNDLE" release/evidence/wheel-sbom.intoto.jsonl
      - name: Attest the source-distribution SBOM
        id: sdist_sbom
        if: steps.collisions.outputs.github != 'skip'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: release/distributions/skywright-${{ needs.validate.outputs.version }}.tar.gz
          sbom-path: release/evidence/skywright-${{ needs.validate.outputs.version }}.tar.gz.spdx.json
      - name: Retain source-distribution SBOM attestation with the release
        if: steps.collisions.outputs.github != 'skip'
        env:
          BUNDLE: ${{ steps.sdist_sbom.outputs.bundle-path }}
        run: cp "$BUNDLE" release/evidence/source-sbom.intoto.jsonl
      - name: Recheck distributions immediately before publication
        run: |
          cd release/distributions
          sha256sum --check ../evidence/SHA256SUMS
      - name: Publish to PyPI with Trusted Publishing and attestations
        id: pypi
        if: steps.collisions.outputs.pypi == 'publish'
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: release/distributions/
          attestations: true
      - name: Reject an unavailable exact PyPI identity
        if: steps.pypi.outcome == 'failure'
        run: |
          echo "Trusted Publishing could not publish the exact 'skywright' PyPI project." >&2
          echo "The release will not substitute another distribution identity." >&2
          exit 1
      - name: Publish the matching immutable GitHub Release
        if: steps.collisions.outputs.github == 'publish'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          gh release create "$TAG" \
            release/distributions/* \
            release/evidence/SHA256SUMS \
            release/evidence/release-manifest.json \
            release/evidence/*.spdx.json \
            release/evidence/*.intoto.jsonl \
            --repo "$GITHUB_REPOSITORY" \
            --title "Skywright SDK v$VERSION" \
            --notes-file release/evidence/RELEASE.md \
            --verify-tag
      - name: Complete an interrupted matching GitHub Release
        if: steps.collisions.outputs.github == 'repair'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          for path in \
            release/distributions/* \
            release/evidence/SHA256SUMS \
            release/evidence/release-manifest.json \
            release/evidence/*.spdx.json \
            release/evidence/*.intoto.jsonl; do
            name="$(basename "$path")"
            if ! jq --exit-status --arg name "$name" \
              '.assets[]? | select(.name == $name)' github-release.json > /dev/null; then
              gh release upload "$TAG" "$path" --repo "$GITHUB_REPOSITORY"
            fi
          done
