name: Format

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
        with:
          version: '0.8.8'
          enable-cache: true
      - name: Check SDK
        run: sdk/scripts/check

  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - name: Check Spring Java Format
        run: ./mvnw --batch-mode spring-javaformat:validate
