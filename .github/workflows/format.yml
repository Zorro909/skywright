name: Format

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  java:
    name: Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: graalvm-community
          cache: maven
      - name: Check Spring Java Format
        run: ./mvnw --batch-mode spring-javaformat:validate
