name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id
    }}
  # A canceled native build cannot save its progressive wheel cache.
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      application: ${{ steps.plan.outputs.application }}
      deployment: ${{ steps.plan.outputs.deployment }}
      plan: ${{ steps.plan.outputs.plan }}
      frontend: ${{ steps.plan.outputs.frontend }}
      image: ${{ steps.plan.outputs.image }}
      integration: ${{ steps.plan.outputs.integration }}
      java: ${{ steps.plan.outputs.java }}
      profile: ${{ steps.plan.outputs.profile }}
      sdk: ${{ steps.plan.outputs.sdk }}
      security: ${{ steps.plan.outputs.security }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test the quality planner and gate
        run: python3 -m unittest discover -s tests/quality -v
      - name: Record source identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          TESTED_REVISION: ${{ github.sha }}
        run: |
          arguments=(
            identity
            --event "$EVENT_NAME"
            --tested-revision "$TESTED_REVISION"
            --format json
            --output quality-metadata.json
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            arguments+=(--head-revision "$HEAD_REVISION")
          fi
          scripts/quality "${arguments[@]}"
      - name: Plan applicable checks
        id: plan
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base_revision="$BASE_REVISION"
          if [[ -z "$base_revision" || "$base_revision" =~ ^0+$ ]]; then
            base_revision="HEAD^"
          fi
          scripts/quality plan \
            --base "$base_revision" \
            --format text \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-source-identity
          path: quality-metadata.json
          if-no-files-found: error
          retention-days: 90

  deployment:
    name: Deployment contracts
    needs: plan
    if: needs.plan.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Run deployment command and render tests
        run: scripts/quality run deployment 2>&1 | tee deployment-contracts.log
      - name: Retain deployment test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-reports
          path: |
            deployment-contracts.log
            target/test-results/deployment.xml
          if-no-files-found: ignore
          retention-days: 90

  graalpy:
    name: Prepare packaged GraalPy environment
    needs: plan
    if: >-
      needs.plan.outputs.java == 'true' ||
      needs.plan.outputs.integration == 'true' ||
      needs.plan.outputs.application == 'true' ||
      needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    outputs:
      producer-attempt: ${{ steps.archive.outputs.producer-attempt }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare and validate qualified GraalPy dependencies
        id: graalpy
        uses: ./.github/actions/prepare-graalpy
      - name: Archive packaged GraalPy environment
        id: archive
        if: steps.graalpy.outcome == 'success'
        run: |
          scripts/graalpy-environment stamp --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" --source "$GITHUB_SHA" \
            --output .graalpy/artifact-provenance.json
          tar --zstd \
            --create \
            --file="${RUNNER_TEMP}/graalpy-resources.tar.zst" \
            --directory=.graalpy \
            resources artifact-provenance.json
          echo "producer-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Hand GraalPy environment to dependent jobs
        if: steps.graalpy.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-resources.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  java:
    name: Java and backend
    needs: [plan, graalpy]
    if: needs.plan.outputs.java == 'true'
    runs-on: ubuntu-24.04
    outputs:
      producer-attempt: ${{ steps.backend-build.outputs.producer-attempt }}
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
      GRAALPY_PRODUCER_ATTEMPT: ${{ needs.graalpy.outputs.producer-attempt }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          scripts/graalpy-environment provenance --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GRAALPY_PRODUCER_ATTEMPT" --source "$GITHUB_SHA" --output .graalpy/artifact-provenance.json
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Build and verify the backend once
        id: backend-build
        run: |
          scripts/ci-backend build ci/verified-backend
          echo "producer-attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Hand verified backend artifacts to browser and image jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-backend-${{ github.run_attempt }}
          path: ci/verified-backend
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 30 || 7 }}
          compression-level: 0
      - name: Retain Java test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90

  integration-java:
    name: Real-service integration / Java
    needs: [plan, graalpy]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
      GRAALPY_PRODUCER_ATTEMPT: ${{ needs.graalpy.outputs.producer-attempt }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          scripts/graalpy-environment provenance --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GRAALPY_PRODUCER_ATTEMPT" --source "$GITHUB_SHA" --output .graalpy/artifact-provenance.json
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Set up primary Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Qualify PostgreSQL and S3-compatible behavior
        run: >-
          mvn --batch-mode --no-transfer-progress
          -DskipFrontendInstall=true -DskipFrontendTests=true
          -Dgroups=real-service -pl backend -am verify
      - name: Retain integration test and service diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports
          path: |
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            **/target/service-logs/**
          if-no-files-found: ignore
          retention-days: 90

  integration-sdk:
    name: Real-service integration / SDK
    needs: plan
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up primary Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Qualify SDK storage and recovery behavior
        run: sdk/scripts/integration
      - name: Retain SDK integration test and service diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-integration-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
            sdk/target/service-logs/**
            sdk/target/dataset-read-measurements/**
          if-no-files-found: ignore
          retention-days: 90

  integration:
    name: Real-service integration
    needs: [plan, integration-java, integration-sdk]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable integration lane
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
          APPLICABLE: ${{ needs.plan.outputs.integration }}
          JAVA_RESULT: ${{ needs.integration-java.result }}
          SDK_RESULT: ${{ needs.integration-sdk.result }}
        run: |
          test "$PLAN_RESULT" = success
          if [[ "$APPLICABLE" != true ]]; then
            echo 'INAPPLICABLE integration'
            exit 0
          fi
          test "$JAVA_RESULT" = success
          test "$SDK_RESULT" = success

  frontend:
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: true
      - name: Run frontend verification
        run: scripts/quality run frontend --frontend-dependencies-ready
      - name: Retain frontend test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90

  application:
    name: Complete application
    needs: [plan, graalpy, java]
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-24.04
    env:
      BACKEND_PRODUCER_ATTEMPT: ${{ needs.java.outputs.producer-attempt }}
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
      GRAALPY_PRODUCER_ATTEMPT: ${{ needs.graalpy.outputs.producer-attempt }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          scripts/graalpy-environment provenance --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GRAALPY_PRODUCER_ATTEMPT" --source "$GITHUB_SHA" --output .graalpy/artifact-provenance.json
      - name: Receive verified backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-backend-${{ needs.java.outputs.producer-attempt }}
          path: ci/verified-backend
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: true
      - name: Qualify the complete application
        run: scripts/ci-backend application ci/verified-backend --producer-attempt "$BACKEND_PRODUCER_ATTEMPT"
      - name: Retain application test, coverage, and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90

  image:
    name: Production control-plane images
    needs: [plan, graalpy, java]
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04
    env:
      BACKEND_PRODUCER_ATTEMPT: ${{ needs.java.outputs.producer-attempt }}
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
      GRAALPY_PRODUCER_ATTEMPT: ${{ needs.graalpy.outputs.producer-attempt }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          scripts/graalpy-environment provenance --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GRAALPY_PRODUCER_ATTEMPT" --source "$GITHUB_SHA" --output .graalpy/artifact-provenance.json
      - name: Receive verified backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-backend-${{ needs.java.outputs.producer-attempt }}
          path: ci/verified-backend
      - name: Set up Python for the real SDK image qualification
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Build and exercise the production image
        id: build_image
        run: scripts/ci-backend image ci/verified-backend --producer-attempt "$BACKEND_PRODUCER_ATTEMPT"
      - name: Prepare image security reports
        if: steps.build_image.outcome == 'success'
        run: mkdir --parents security-results
      - name: Set up Trivy databases once
        if: steps.build_image.outcome == 'success'
        uses: ./.github/actions/setup-trivy
      - name: Record all high and critical image findings
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: image
          image-ref: skywright-backend:0.1.0-SNAPSHOT
          severity: HIGH,CRITICAL
          format: sarif
          output: security-results/backend-image.sarif
          exit-code: '0'
      - name: Reject fixable high and critical image findings
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: image
          image-ref: skywright-backend:0.1.0-SNAPSHOT
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record SkyPilot API server high and critical image findings
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: image
          image-ref: skywright-skypilot-api-server:0.1.0-SNAPSHOT
          severity: HIGH,CRITICAL
          format: sarif
          output: security-results/skypilot-api-server-image.sarif
          exit-code: '0'
      - name: Reject fixable SkyPilot API server high and critical findings
        if: steps.build_image.outcome == 'success'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          cache: false
          skip-setup-trivy: true
          scan-type: image
          image-ref: skywright-skypilot-api-server:0.1.0-SNAPSHOT
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Retain image acceptance and security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
            security-results/backend-image.sarif
            security-results/skypilot-api-server-image.sarif
          if-no-files-found: ignore
          retention-days: 90

  profile:
    name: Environment Profiles
    needs: plan
    if: needs.plan.outputs.profile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Build and qualify CUDA and ROCm without accelerator hardware
        run: scripts/quality run profile
      - name: Retain profile qualification facts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: environment-profile-reports
          path: environment-profiles/target/qualification/**
          if-no-files-found: ignore
          retention-days: 90

  sdk-compatibility:
    name: Python SDK / Python ${{ matrix.python-version }}
    needs:
      - plan
      - sdk-artifacts
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: ${{ matrix.python-version }}
      - name: Receive distributions from the primary lane
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-qualified-distributions
          path: sdk-dist
      - name: Qualify SDK runtime and installed distributions
        run: |
          sdk/scripts/test-unit
          uv run --project sdk --locked pytest sdk/tests/system -m system \
            --junitxml sdk/target/test-results/system-${{ matrix.python-version }}.xml \
            --artifact-dir sdk-dist
      - name: Retain SDK test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-python-${{ matrix.python-version }}-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90

  sdk-artifacts:
    name: Python SDK / Primary artifacts
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up primary Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Build each distribution once and run complete SDK and project-action verification
        run: |
          sdk/scripts/verify target/ci-dist
          .github/actions/publish-training-project/scripts/check
      - name: Hand verified distributions to compatibility lanes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-qualified-distributions
          path: sdk/target/ci-dist/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 30 || 7 }}
      - name: Retain SDK test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-primary-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90

  sdk:
    name: Python SDK
    if: always()
    needs:
      - plan
      - sdk-artifacts
      - sdk-compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable SDK lane
        env:
          APPLICABLE: ${{ needs.plan.outputs.sdk }}
          ARTIFACT_RESULT: ${{ needs.sdk-artifacts.result }}
          COMPATIBILITY_RESULT: ${{ needs.sdk-compatibility.result }}
        run: |
          if [[ "$APPLICABLE" != "true" ]]; then
            echo "SDK qualification is deliberately inapplicable."
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" != "success" || "$COMPATIBILITY_RESULT" != "success" ]]; then
            echo "SDK qualification failed: artifacts=$ARTIFACT_RESULT compatibility=$COMPATIBILITY_RESULT" >&2
            exit 1
          fi
          echo "SDK qualification passed on Python 3.10 through 3.14."

  security:
    name: Security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate security suppressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/quality security-policy --verify-issues
      - name: Review dependency changes
        id: dependency-review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: true
          show-patched-versions: true
          comment-summary-in-pr: never
      - name: Enforce fixable dependency findings
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABLE_CHANGES: ${{ steps.dependency-review.outputs.vulnerable-changes }}
        run: |
          scripts/quality dependency-policy \
            --changes "${VULNERABLE_CHANGES:-[]}" \
            --report security-results/dependency-review.json
      - name: Initialize CodeQL
        id: codeql-init
        if: always()
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin,javascript-typescript,python
          build-mode: none
      - name: Analyze supported source languages
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:multi-language
          output: security-results/codeql
          upload: always
      - name: Audit CodeQL alert dismissals
        if: >-
          always() &&
          steps.codeql-analyze.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/quality github-dismissal-policy --scanner codeql
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: security-results/**
          if-no-files-found: ignore
          retention-days: 90

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - plan
      - application
      - deployment
      - java
      - frontend
      - image
      - integration
      - profile
      - sdk
      - security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a valid plan
        if: needs.plan.result != 'success'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "The quality plan did not succeed: $PLAN_RESULT" >&2
          exit 1
      - name: Aggregate required outcomes
        if: needs.plan.result == 'success'
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          PLAN: ${{ needs.plan.outputs.plan }}
          PROFILE_RESULT: ${{ needs.profile.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          scripts/quality aggregate \
            --result "application=$APPLICATION_RESULT" \
            --result "deployment=$DEPLOYMENT_RESULT" \
            --plan "$PLAN" \
            --result "frontend=$FRONTEND_RESULT" \
            --result "image=$IMAGE_RESULT" \
            --result "integration=$INTEGRATION_RESULT" \
            --result "java=$JAVA_RESULT" \
            --result "profile=$PROFILE_RESULT" \
            --result "sdk=$SDK_RESULT" \
            --result "security=$SECURITY_RESULT"
