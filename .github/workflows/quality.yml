name: Repository Quality

on:
  pull_request:
  push:
    branches:
      - main
  merge_group:

# Verification jobs cancel independently. Native preparation must finish saving wheels.
permissions:
  contents: read
  actions: read
  pull-requests: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  plan:
    concurrency:
      group: quality-plan-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Plan
    runs-on: ubuntu-24.04
    outputs:
      application: ${{ steps.plan.outputs.application }}
      deployment: ${{ steps.plan.outputs.deployment }}
      plan: ${{ steps.plan.outputs.plan }}
      frontend: ${{ steps.plan.outputs.frontend }}
      image: ${{ steps.plan.outputs.image }}
      integration: ${{ steps.plan.outputs.integration }}
      java: ${{ steps.plan.outputs.java }}
      profile: ${{ steps.plan.outputs.profile }}
      sdk: ${{ steps.plan.outputs.sdk }}
      security: ${{ steps.plan.outputs.security }}
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Test quality planning and orchestration
        run: python3 -m unittest discover -s tests/quality
      - name: Record source identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REVISION: ${{ github.event.pull_request.head.sha }}
          TESTED_REVISION: ${{ github.sha }}
        run: |
          arguments=(
            identity
            --event "$EVENT_NAME"
            --tested-revision "$TESTED_REVISION"
            --format json
            --output quality-metadata.json
          )
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            arguments+=(--head-revision "$HEAD_REVISION")
          fi
          scripts/quality "${arguments[@]}"
      - name: Plan applicable checks
        id: plan
        env:
          BASE_REVISION: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          base_revision="$BASE_REVISION"
          if [[ -z "$base_revision" || "$base_revision" =~ ^0+$ ]]; then
            base_revision="HEAD^"
          fi
          scripts/quality plan \
            --base "$base_revision" \
            --format text \
            --github-output "$GITHUB_OUTPUT"
      - name: Retain source identity
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-source-identity
          path: quality-metadata.json
          if-no-files-found: error
          retention-days: 90

  deployment:
    concurrency:
      group: quality-deployment-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Deployment contracts
    needs: plan
    if: needs.plan.outputs.deployment == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Run deployment command and render tests
        run: scripts/ci-verify -- scripts/quality run deployment 2>&1 | tee deployment-contracts.log
      - name: Retain deployment test diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: deployment-reports
          path: |
            deployment-contracts.log
            target/test-results/deployment.xml
          if-no-files-found: ignore
          retention-days: 90

  graalpy:
    concurrency:
      group: quality-graalpy-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    name: Prepare packaged GraalPy environment
    needs: plan
    if: >-
      needs.plan.outputs.java == 'true' ||
      needs.plan.outputs.integration == 'true' ||
      needs.plan.outputs.application == 'true' ||
      needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 270
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Prepare qualified native dependencies
        uses: ./.github/actions/prepare-graalpy
      - name: Archive packaged GraalPy environment
        run: |
          tar --zstd \
            --create \
            --file="${RUNNER_TEMP}/graalpy-resources.tar.zst" \
            --directory=.graalpy \
            resources
      - name: Hand GraalPy environment to dependent jobs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-resources.tar.zst
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  java:
    concurrency:
      group: quality-java-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Java and backend
    needs: [plan, graalpy]
    if: needs.plan.outputs.java == 'true' || needs.plan.outputs.application == 'true' || needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          test -f .graalpy/resources/venv/installed.txt
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Run Java verification
        run: scripts/ci-verify -- scripts/ci-backend build "$RUNNER_TEMP/backend-handoff"
      - name: Hand off verified backend artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verified-backend
          path: ${{ runner.temp }}/backend-handoff
          retention-days: 1
          if-no-files-found: error
      - name: Retain Java test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: java-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove reactor outputs from the dependency cache
        if: always()
        run: rm -rf "$HOME/.m2/repository/de/zorro909/skywright"

  integration:
    concurrency:
      group: quality-integration-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Real-service integration
    needs: [plan, graalpy]
    if: needs.plan.outputs.integration == 'true'
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          test -f .graalpy/resources/venv/installed.txt
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Set up primary Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Qualify PostgreSQL and S3-compatible behavior
        run: scripts/ci-verify -- scripts/quality run integration --frontend-dependencies-ready
      - name: Retain integration test and service diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: integration-reports
          path: |
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            **/target/service-logs/**
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove reactor outputs from the dependency cache
        if: always()
        run: rm -rf "$HOME/.m2/repository/de/zorro909/skywright"

  frontend:
    concurrency:
      group: quality-frontend-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Frontend
    needs: plan
    if: needs.plan.outputs.frontend == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: true
      - name: Run frontend verification
        run: scripts/ci-verify -- scripts/quality run frontend --frontend-dependencies-ready
      - name: Retain frontend test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: frontend-reports
          path: |
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90

  application:
    concurrency:
      group: quality-application-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Complete application
    needs: [plan, graalpy, java]
    if: needs.plan.outputs.application == 'true'
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          test -f .graalpy/resources/venv/installed.txt
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: true
      - name: Receive verified backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-backend
          path: ${{ runner.temp }}/backend-handoff
      - name: Qualify the complete application
        run: scripts/ci-verify -- scripts/ci-backend application "$RUNNER_TEMP/backend-handoff"
      - name: Retain application test, coverage, and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove reactor outputs from the dependency cache
        if: always()
        run: rm -rf "$HOME/.m2/repository/de/zorro909/skywright"

  image:
    concurrency:
      group: quality-image-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Production control-plane images
    needs: [plan, graalpy, java]
    if: needs.plan.outputs.image == 'true'
    runs-on: ubuntu-24.04
    env:
      MAVEN_ARGS: -Dgraalpy.environment.prebuilt=true
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up GraalVM Community
        uses: ./.github/actions/setup-java
      - name: Receive packaged GraalPy environment
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: graalpy-resources
          path: ${{ runner.temp }}/graalpy-artifact
      - name: Restore packaged GraalPy environment
        run: |
          mkdir --parents .graalpy
          tar --zstd \
            --extract \
            --file="${RUNNER_TEMP}/graalpy-artifact/graalpy-resources.tar.zst" \
            --directory=.graalpy
          test -f .graalpy/resources/venv/installed.txt
      - name: Receive verified backend artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verified-backend
          path: ${{ runner.temp }}/backend-handoff
      - name: Build and exercise the production image
        id: build_image
        run: scripts/ci-verify -- scripts/ci-backend image "$RUNNER_TEMP/backend-handoff"
      - name: Prepare image security reports
        if: steps.build_image.outcome == 'success'
        run: mkdir --parents security-results
      - name: Identify scanner cache generation
        if: always() && steps.build_image.outcome == 'success'
        id: trivy-date
        run: echo "day=$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - name: Set up Trivy once
        if: always() && steps.build_image.outcome == 'success'
        uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true
      - name: Restore scanner databases once
        if: always() && steps.build_image.outcome == 'success'
        id: trivy-db
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/trivy/db
            .cache/trivy/java-db
          key: trivy-db-v1-${{ runner.os }}-${{ runner.arch }}-${{ steps.trivy-date.outputs.day }}
          restore-keys: trivy-db-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Record all high and critical image findings
        if: always() && steps.build_image.outcome == 'success'
        run: scripts/ci-verify -- trivy image --cache-dir .cache/trivy --severity HIGH,CRITICAL --format sarif --output security-results/backend-image.sarif --exit-code 0 skywright-backend:0.1.0-SNAPSHOT
      - name: Reject fixable high and critical image findings
        if: always() && steps.build_image.outcome == 'success'
        run: scripts/ci-verify -- trivy image --cache-dir .cache/trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 skywright-backend:0.1.0-SNAPSHOT
      - name: Record SkyPilot API server high and critical image findings
        if: always() && steps.build_image.outcome == 'success'
        run: scripts/ci-verify -- trivy image --cache-dir .cache/trivy --severity HIGH,CRITICAL --format sarif --output security-results/skypilot-api-server-image.sarif --exit-code 0 skywright-skypilot-api-server:0.1.0-SNAPSHOT
      - name: Reject fixable SkyPilot API server high and critical findings
        if: always() && steps.build_image.outcome == 'success'
        run: scripts/ci-verify -- trivy image --cache-dir .cache/trivy --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 skywright-skypilot-api-server:0.1.0-SNAPSHOT
      - name: Save scanner databases once on main
        if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.trivy-db.outcome == 'success' && steps.trivy-db.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            .cache/trivy/db
            .cache/trivy/java-db
          key: ${{ steps.trivy-db.outputs.cache-primary-key }}
      - name: Retain image acceptance and security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
            **/target/site/jacoco/**
            **/target/site/jacoco-it/**
            frontend/coverage/**
            frontend/target/test-results/**
            frontend/test-results/**
            frontend/playwright-report/**
            security-results/backend-image.sarif
            security-results/skypilot-api-server-image.sarif
          if-no-files-found: ignore
          retention-days: 90
      - name: Remove reactor outputs from the dependency cache
        if: always()
        run: rm -rf "$HOME/.m2/repository/de/zorro909/skywright"

  profile:
    concurrency:
      group: quality-profile-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Environment Profiles
    needs: plan
    if: needs.plan.outputs.profile == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Build and qualify CUDA and ROCm without accelerator hardware
        run: scripts/ci-verify -- scripts/quality run profile
      - name: Retain profile qualification facts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: environment-profile-reports
          path: environment-profiles/target/qualification/**
          if-no-files-found: ignore
          retention-days: 90

  sdk-compatibility:
    concurrency:
      group: quality-sdk-compatibility-${{ github.event.pull_request.number || github.run_id }}-${{ matrix.python-version }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Python SDK / Python ${{ matrix.python-version }}
    needs:
      - plan
      - sdk-artifacts
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - '3.10'
          - '3.11'
          - '3.12'
          - '3.13'
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: ${{ matrix.python-version }}
      - name: Receive distributions from the primary lane
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sdk-qualified-distributions
          path: sdk-dist
      - name: Qualify the installed SDK and contributor checks
        run: |
          scripts/ci-verify -- sdk/scripts/test-unit
          scripts/ci-verify -- uv run --project sdk --locked pytest sdk/tests/system -m system \
            --junitxml sdk/target/test-results/system-${{ matrix.python-version }}.xml \
            --artifact-dir sdk-dist
      - name: Retain SDK test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-python-${{ matrix.python-version }}-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90

  sdk-artifacts:
    concurrency:
      group: quality-sdk-artifacts-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Python SDK / Primary artifacts
    needs: plan
    if: needs.plan.outputs.sdk == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Set up primary Python
        uses: ./.github/actions/setup-python-toolchain
        with:
          python-version: '3.14'
      - name: Build each distribution once and run complete SDK and project-action verification
        run: |
          scripts/ci-verify -- sdk/scripts/verify target/ci-dist
          scripts/ci-verify -- .github/actions/publish-training-project/scripts/check
      - name: Hand verified distributions to compatibility lanes
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-qualified-distributions
          path: sdk/target/ci-dist/*
          if-no-files-found: error
          retention-days: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 30 || 7 }}
      - name: Retain SDK test and diagnostic reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sdk-primary-reports
          path: |
            sdk/target/test-results/**
            sdk/target/coverage/**
          if-no-files-found: ignore
          retention-days: 90

  sdk:
    name: Python SDK
    if: always()
    needs:
      - plan
      - sdk-artifacts
      - sdk-compatibility
    runs-on: ubuntu-24.04
    steps:
      - name: Require every applicable SDK lane
        env:
          APPLICABLE: ${{ needs.plan.outputs.sdk }}
          ARTIFACT_RESULT: ${{ needs.sdk-artifacts.result }}
          COMPATIBILITY_RESULT: ${{ needs.sdk-compatibility.result }}
        run: |
          if [[ "$APPLICABLE" != "true" ]]; then
            echo "SDK qualification is deliberately inapplicable."
            exit 0
          fi
          if [[ "$ARTIFACT_RESULT" != "success" || "$COMPATIBILITY_RESULT" != "success" ]]; then
            echo "SDK qualification failed: artifacts=$ARTIFACT_RESULT compatibility=$COMPATIBILITY_RESULT" >&2
            exit 1
          fi
          echo "SDK qualification passed on Python 3.10 through 3.14."

  security:
    concurrency:
      group: quality-security-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Security
    needs: plan
    if: needs.plan.outputs.security == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Reject superseded PR source
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)" = "$EXPECTED_HEAD"
      - name: Validate security suppressions
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/quality security-policy --verify-issues
      - name: Review dependency changes
        id: dependency-review
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          warn-only: true
          show-patched-versions: true
          comment-summary-in-pr: never
      - name: Enforce fixable dependency findings
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VULNERABLE_CHANGES: ${{ steps.dependency-review.outputs.vulnerable-changes }}
        run: |
          scripts/quality dependency-policy \
            --changes "${VULNERABLE_CHANGES:-[]}" \
            --report security-results/dependency-review.json
      - name: Initialize CodeQL
        id: codeql-init
        if: always()
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: java-kotlin,javascript-typescript,python
          build-mode: none
      - name: Analyze supported source languages
        id: codeql-analyze
        if: always() && steps.codeql-init.outcome == 'success'
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:multi-language
          output: security-results/codeql
          upload: always
      - name: Audit CodeQL alert dismissals
        if: >-
          always() &&
          steps.codeql-analyze.outcome == 'success' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: scripts/quality github-dismissal-policy --scanner codeql
      - name: Retain security reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: security-reports
          path: security-results/**
          if-no-files-found: ignore
          retention-days: 90

  quality-gate:
    name: Quality Gate
    if: always()
    needs:
      - plan
      - application
      - deployment
      - java
      - frontend
      - image
      - integration
      - profile
      - sdk
      - security
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Require a valid plan
        if: needs.plan.result != 'success'
        env:
          PLAN_RESULT: ${{ needs.plan.result }}
        run: |
          echo "The quality plan did not succeed: $PLAN_RESULT" >&2
          exit 1
      - name: Aggregate required outcomes
        if: needs.plan.result == 'success'
        env:
          APPLICATION_RESULT: ${{ needs.application.result }}
          DEPLOYMENT_RESULT: ${{ needs.deployment.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          IMAGE_RESULT: ${{ needs.image.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          JAVA_RESULT: ${{ needs.java.result }}
          PLAN: ${{ needs.plan.outputs.plan }}
          PROFILE_RESULT: ${{ needs.profile.result }}
          SDK_RESULT: ${{ needs.sdk.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          scripts/quality aggregate \
            --result "application=$APPLICATION_RESULT" \
            --result "deployment=$DEPLOYMENT_RESULT" \
            --plan "$PLAN" \
            --result "frontend=$FRONTEND_RESULT" \
            --result "image=$IMAGE_RESULT" \
            --result "integration=$INTEGRATION_RESULT" \
            --result "java=$JAVA_RESULT" \
            --result "profile=$PROFILE_RESULT" \
            --result "sdk=$SDK_RESULT" \
            --result "security=$SECURITY_RESULT"

  cache-maintenance:
    name: Bound scanner database retention
    needs: image
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.image.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Retain the two newest main database snapshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import json, os, subprocess
          repository = os.environ["GITHUB_REPOSITORY"]
          pages = json.loads(subprocess.check_output([
              "gh", "api", "--paginate", "--slurp",
              f"repos/{repository}/actions/caches?per_page=100",
          ], text=True))
          caches = [entry for page in pages for entry in page["actions_caches"]
                    if entry["key"].startswith("trivy-db-v1-") and entry["ref"] == "refs/heads/main"]
          for entry in sorted(caches, key=lambda entry: entry["created_at"], reverse=True)[2:]:
              subprocess.run(["gh", "api", "--method", "DELETE",
                              f"repos/{repository}/actions/caches/{entry['id']}"], check=True)
          PYTHON
