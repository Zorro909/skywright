name: Deployment release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: Canonical vMAJOR.MINOR.PATCH release tag
        required: true
        type: string
      release_run_id:
        description: Original run ID when repairing a partial publication
        required: false
        type: string

concurrency:
  group: deployment-release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  qualify-main:
    name: Build main deployment images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Plan deployment image qualification
        id: plan
        env:
          BASE_REVISION: ${{ github.event.before }}
        run: |
          if [[ -z "$BASE_REVISION" || "$BASE_REVISION" =~ ^0+$ ]]; then BASE_REVISION=HEAD^; fi
          scripts/quality plan --base "$BASE_REVISION" --github-output "$GITHUB_OUTPUT"
      - name: Prepare qualified native dependencies
        if: steps.plan.outputs.image == 'true'
        uses: ./.github/actions/prepare-graalpy
      - name: Set up frontend prerequisites
        if: steps.plan.outputs.image == 'true'
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Install pinned Skaffold
        if: steps.plan.outputs.image == 'true'
        env:
          SKAFFOLD_SHA256: 702344081860a587c57937cd55dfa2e70f124c05d6fb845319832ee23fd144a8
        run: |
          install_dir="$RUNNER_TEMP/skywright-main-tools"
          mkdir --parents "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$install_dir/skaffold" \
            https://storage.googleapis.com/skaffold/releases/v2.24.0/skaffold-linux-amd64
          echo "$SKAFFOLD_SHA256  $install_dir/skaffold" | sha256sum --check
          chmod +x "$install_dir/skaffold"
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Build and test through the deployment image contract
        if: steps.plan.outputs.image == 'true'
        run: skaffold build --profile local-kind --tag "$GITHUB_SHA" 2>&1 | tee deployment-image-build.log
      - name: Retain main deployment build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: main-deployment-build-${{ github.sha }}
          path: |
            deployment-image-build.log
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          if-no-files-found: ignore
          retention-days: 90

  publish:
    name: Publish immutable deployment bundle
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      backend_digest: ${{ steps.publish.outputs.backend_digest }}
      bundle_digest: ${{ steps.publish.outputs.bundle_digest }}
      skypilot_digest: ${{ steps.publish.outputs.skypilot_digest }}
    steps:
      - name: Check out the release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Prepare qualified native dependencies
        uses: ./.github/actions/prepare-graalpy
      - name: Set up frontend prerequisites
        uses: ./.github/actions/setup-frontend
        with:
          install-browser: false
      - name: Install pinned release tools
        env:
          SKAFFOLD_SHA256: 702344081860a587c57937cd55dfa2e70f124c05d6fb845319832ee23fd144a8
          ORAS_SHA256: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
        run: |
          install_dir="$RUNNER_TEMP/skywright-release-tools"
          mkdir --parents "$install_dir"
          curl --fail --location --silent --show-error \
            --output "$install_dir/skaffold" \
            https://storage.googleapis.com/skaffold/releases/v2.24.0/skaffold-linux-amd64
          echo "$SKAFFOLD_SHA256  $install_dir/skaffold" | sha256sum --check
          chmod +x "$install_dir/skaffold"
          curl --fail --location --silent --show-error \
            --output "$RUNNER_TEMP/oras.tar.gz" \
            https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          echo "$ORAS_SHA256  $RUNNER_TEMP/oras.tar.gz" | sha256sum --check
          tar --extract --gzip --file "$RUNNER_TEMP/oras.tar.gz" --directory "$install_dir" oras
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Validate version and source ancestry
        id: release
        env:
          REQUESTED_VERSION: ${{ inputs.version || github.ref_name }}
          REQUESTED_RUN_ID: ${{ inputs.release_run_id }}
        run: |
          classification="$(deployment/scripts/release-support classify-version "$REQUESTED_VERSION")"
          skypilot_version="$(deployment/scripts/release-support shared-skypilot-version \
            --pom pom.xml \
            --lock graalpy-environment/graalpy.lock)"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          scripts/quality identity \
            --event tag \
            --tested-revision "$GITHUB_SHA" \
            --tag-commit "$GITHUB_SHA" \
            --format json \
            --output deployment-quality-metadata.json
          if [[ "$GITHUB_EVENT_NAME" == push && "$REQUESTED_VERSION" != "$GITHUB_REF_NAME" ]]; then
            echo "The release version does not match the pushed tag." >&2
            exit 1
          fi
          echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
          echo "classification=$classification" >> "$GITHUB_OUTPUT"
          echo "release_run_id=${REQUESTED_RUN_ID:-$GITHUB_RUN_ID}" >> "$GITHUB_OUTPUT"
          echo "skypilot_version=$skypilot_version" >> "$GITHUB_OUTPUT"
      - name: Require the successful main quality gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          conclusion="$(gh run list \
            --workflow quality.yml \
            --commit "$GITHUB_SHA" \
            --event push \
            --status completed \
            --limit 20 \
            --json conclusion \
            --jq '.[0].conclusion // ""')"
          if [[ "$conclusion" != success ]]; then
            echo "The release commit has no successful main Repository Quality run." >&2
            exit 1
          fi
      - name: Authenticate to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Build, test, and identify the control-plane images
        env:
          BACKEND_TAG: ghcr.io/zorro909/skywright-backend:${{ github.sha }}
          SKYPILOT_VERSION: ${{ steps.release.outputs.skypilot_version }}
          SKYPILOT_TAG: ghcr.io/zorro909/skywright-skypilot-api-server:${{ github.sha }}
        run: |
          backend_image=""
          skypilot_image=""
          missing=()
          if backend_digest="$(oras resolve "$BACKEND_TAG" 2>/dev/null)"; then
            backend_image="ghcr.io/zorro909/skywright-backend@$backend_digest"
          else
            missing+=(skywright-backend)
          fi
          if skypilot_digest="$(oras resolve "$SKYPILOT_TAG" 2>/dev/null)"; then
            skypilot_image="ghcr.io/zorro909/skywright-skypilot-api-server@$skypilot_digest"
          else
            missing+=(skywright-skypilot-api-server)
          fi
          if (( ${#missing[@]} == 0 )); then
            scripts/quality run image --frontend-dependencies-ready
          else
            build=(skaffold build \
              --profile production \
              --default-repo ghcr.io/zorro909 \
              --tag "$GITHUB_SHA" \
              --file-output newly-built-artifacts.json)
            for image in "${missing[@]}"; do
              build+=(--build-image "$image")
            done
            "${build[@]}"
            if [[ -z "$backend_image" ]]; then
              backend_image="$(jq --raw-output \
                '.builds[] | select(.imageName == "skywright-backend") | .tag' \
                newly-built-artifacts.json)"
            fi
            if [[ -z "$skypilot_image" ]]; then
              skypilot_image="$(jq --raw-output \
                '.builds[] | select(.imageName == "skywright-skypilot-api-server") | .tag' \
                newly-built-artifacts.json)"
            fi
          fi
          for tag in "$BACKEND_TAG" "$SKYPILOT_TAG"; do
            docker pull "$tag"
            revision="$(docker image inspect \
              --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' \
              "$tag")"
            image_skypilot_version="$(docker image inspect \
              --format '{{ index .Config.Labels "io.skywright.skypilot.version" }}' \
              "$tag")"
            if [[ "$revision" != "$GITHUB_SHA" ]]; then
              echo "Existing image $tag does not identify this source commit." >&2
              exit 1
            fi
            if [[ "$image_skypilot_version" != "$SKYPILOT_VERSION" ]]; then
              echo "Image $tag does not use shared SkyPilot $SKYPILOT_VERSION." >&2
              exit 1
            fi
          done
          jq --null-input \
            --arg backend "$backend_image" \
            --arg skypilot "$skypilot_image" \
            '{builds:[{imageName:"skywright-backend",tag:$backend},{imageName:"skywright-skypilot-api-server",tag:$skypilot}]}' \
            > skaffold-build-artifacts.json
      - name: Render the digest-pinned production release
        env:
          SKYPILOT_VERSION: ${{ steps.release.outputs.skypilot_version }}
        run: |
          skaffold render \
            --profile production \
            --build-artifacts skaffold-build-artifacts.json \
            --output release.yaml
          deployment/scripts/release-support finalize-build-artifacts \
            --input skaffold-build-artifacts.json \
            --output build-artifacts.json \
            --source-commit "$GITHUB_SHA" \
            --skypilot-version "$SKYPILOT_VERSION"
      - name: Build the Deployment Bundle payload
        env:
          VERSION: ${{ steps.release.outputs.version }}
          RELEASE_RUN_ID: ${{ steps.release.outputs.release_run_id }}
          SKYPILOT_VERSION: ${{ steps.release.outputs.skypilot_version }}
        run: |
          deployment/scripts/release-support build-bundle \
            --release-yaml release.yaml \
            --build-artifacts build-artifacts.json \
            --output deployment-bundle \
            --version "$VERSION" \
            --source-commit "$GITHUB_SHA" \
            --backend-image "$(jq --raw-output '.builds[] | select(.imageName == "skywright-backend") | .tag' build-artifacts.json)" \
            --skypilot-image "$(jq --raw-output '.builds[] | select(.imageName == "skywright-skypilot-api-server") | .tag' build-artifacts.json)" \
            --skypilot-version "$SKYPILOT_VERSION" \
            --workflow deployment-release.yml \
            --run-id "$RELEASE_RUN_ID"
      - name: Publish or recover the immutable bundle
        id: publish
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          deployment/scripts/release-support publish-bundle \
            --directory deployment-bundle \
            --repository ghcr.io/zorro909/skywright-deployment \
            --version "$VERSION" \
            --github-output "$GITHUB_OUTPUT"
      - name: Attest the Deployment Bundle digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/zorro909/skywright-deployment
          subject-digest: ${{ steps.publish.outputs.bundle_digest }}
          push-to-registry: false
      - name: Attest the backend image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/zorro909/skywright-backend
          subject-digest: ${{ steps.publish.outputs.backend_digest }}
          push-to-registry: false
      - name: Attest the SkyPilot image digest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-name: ghcr.io/zorro909/skywright-skypilot-api-server
          subject-digest: ${{ steps.publish.outputs.skypilot_digest }}
          push-to-registry: false
      - name: Record durable release evidence
        env:
          VERSION: ${{ steps.release.outputs.version }}
          BUNDLE_DIGEST: ${{ steps.publish.outputs.bundle_digest }}
          BACKEND_DIGEST: ${{ steps.publish.outputs.backend_digest }}
          SKYPILOT_DIGEST: ${{ steps.publish.outputs.skypilot_digest }}
          SKYPILOT_VERSION: ${{ steps.release.outputs.skypilot_version }}
        run: |
          {
            echo "## Deployment release $VERSION"
            echo ""
            echo "The immutable OCI bundle and its embedded checksummed metadata are the durable release record."
            echo ""
            echo "- Bundle: \`ghcr.io/zorro909/skywright-deployment@$BUNDLE_DIGEST\`"
            echo "- Backend: \`ghcr.io/zorro909/skywright-backend@$BACKEND_DIGEST\`"
            echo "- SkyPilot API server: \`ghcr.io/zorro909/skywright-skypilot-api-server@$SKYPILOT_DIGEST\`"
            echo "- Shared SkyPilot version: \`$SKYPILOT_VERSION\`"
          } >> "$GITHUB_STEP_SUMMARY"
