name: Prepare qualified GraalPy dependencies
description: Restore or build the canonical native environment and verify actual runtime/package versions.
outputs:
  identity:
    description: Effective environment identity.
    value: ${{ steps.java.outputs.graalpy-identity }}
  cache-hit:
    description: Whether the exact dependency environment was restored.
    value: ${{ steps.java.outputs.graalpy-cache-hit }}
runs:
  using: composite
  steps:
    - name: Set native dependency preparation paths
      shell: bash
      run: |
        echo "PIP_CACHE_DIR=$GITHUB_WORKSPACE/.ci-cache/graalpy-pip" >> "$GITHUB_ENV"
        echo "PIP_CONSTRAINT=$GITHUB_WORKSPACE/graalpy-environment/build-constraints.txt" >> "$GITHUB_ENV"
        echo "PIP_FIND_LINKS=$GITHUB_WORKSPACE/.ci-cache/graalpy-pip/wheelhouse" >> "$GITHUB_ENV"
    - name: Set up pinned native Rust compiler
      shell: bash
      run: |
        rust_version=$(cat graalpy-environment/rust-toolchain-version)
        if ! rustup run "$rust_version" rustc --version; then
          rustup toolchain install "$rust_version" --profile minimal --no-self-update
        fi
        echo "RUSTUP_TOOLCHAIN=$rust_version" >> "$GITHUB_ENV"
    - name: Set up GraalVM Community and packaged GraalPy cache
      id: java
      uses: ./.github/actions/setup-java
      with:
        graalpy-resources: true
    - name: Test effective Maven version invalidation
      shell: bash
      run: python3 -m unittest discover -s tests/graalpy -v
    - name: Restore progressive GraalPy pip cache
      id: graalpy-pip-cache
      # Restore even on an environment hit so expensive wheels stay in active use.
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .ci-cache/graalpy-pip/wheels
          .ci-cache/graalpy-pip/wheelhouse
        key: ${{ runner.os }}-${{ runner.arch }}-graalpy-wheels-v1-${{ steps.java.outputs.graalpy-wheel-identity }}-complete
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-graalpy-wheels-v1-${{ steps.java.outputs.graalpy-wheel-identity }}-partial-
    - name: Prime pandas wheel cache
      if: steps.java.outputs.graalpy-cache-hit != 'true'
      shell: bash
      run: scripts/prepare-graalpy-wheels
    - name: Checkpoint pandas wheels before installing the full environment
      if: >-
        always() && steps.java.outputs.graalpy-cache-hit != 'true' &&
        steps.graalpy-pip-cache.outcome == 'success' &&
        steps.graalpy-pip-cache.outputs.cache-hit != 'true' &&
        hashFiles('.ci-cache/graalpy-pip/wheels/**', '.ci-cache/graalpy-pip/wheelhouse/**') != '' &&
        steps.graalpy-pip-cache.outputs.cache-matched-key != format('{0}-{1}-graalpy-wheels-v1-{2}-partial-{3}', runner.os, runner.arch, steps.java.outputs.graalpy-wheel-identity, hashFiles('.ci-cache/graalpy-pip/wheels/**', '.ci-cache/graalpy-pip/wheelhouse/**'))
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .ci-cache/graalpy-pip/wheels
          .ci-cache/graalpy-pip/wheelhouse
        key: ${{ runner.os }}-${{ runner.arch }}-graalpy-wheels-v1-${{ steps.java.outputs.graalpy-wheel-identity }}-partial-${{ hashFiles('.ci-cache/graalpy-pip/wheels/**', '.ci-cache/graalpy-pip/wheelhouse/**') }}
    - name: Build packaged GraalPy environment on cache miss
      id: build-graalpy
      if: steps.java.outputs.graalpy-cache-hit != 'true'
      shell: bash
      run: |
        timeout \
          --verbose \
          --kill-after=2m \
          100m \
          mvn \
            --batch-mode \
            --no-transfer-progress \
            -pl graalpy-environment \
            process-resources
    - name: Save additional wheels after an interrupted environment build
      if: >-
        always() && steps.java.outputs.graalpy-cache-hit != 'true' &&
        steps.graalpy-pip-cache.outcome == 'success' &&
        steps.graalpy-pip-cache.outputs.cache-hit != 'true' &&
        steps.build-graalpy.outcome == 'failure' &&
        hashFiles('.ci-cache/graalpy-pip/wheels/**', '.ci-cache/graalpy-pip/wheelhouse/**') != ''
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .ci-cache/graalpy-pip/wheels
          .ci-cache/graalpy-pip/wheelhouse
        key: ${{ runner.os }}-${{ runner.arch }}-graalpy-wheels-v1-${{ steps.java.outputs.graalpy-wheel-identity }}-partial-${{ hashFiles('.ci-cache/graalpy-pip/wheels/**', '.ci-cache/graalpy-pip/wheelhouse/**') }}
    - name: Validate actual packaged runtime and native imports
      id: smoke-graalpy
      if: >-
        always() &&
        (steps.java.outputs.graalpy-cache-hit == 'true' ||
        steps.build-graalpy.outcome == 'success')
      shell: bash
      run: |
        scripts/graalpy-environment verify --expected .graalpy/expected-environment.json
        timeout --verbose --kill-after=30s 5m \
          mvn --batch-mode --no-transfer-progress -Dgraalpy.environment.prebuilt=true \
          -pl graalpy-environment process-resources
    - name: Save complete GraalPy wheel cache
      if: >-
        steps.graalpy-pip-cache.outcome == 'success' &&
        steps.graalpy-pip-cache.outputs.cache-hit != 'true' &&
        steps.build-graalpy.outcome == 'success' &&
        steps.smoke-graalpy.outcome == 'success'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          .ci-cache/graalpy-pip/wheels
          .ci-cache/graalpy-pip/wheelhouse
        key: ${{ steps.graalpy-pip-cache.outputs.cache-primary-key }}
    - name: Test relocated prebuilt packaging and mismatch rejection
      shell: bash
      run: python3 -m unittest discover -s tests/graalpy_prebuilt -v
    - name: Save exact packaged GraalPy environment
      if: >-
        steps.java.outputs.graalpy-cache-hit != 'true' &&
        steps.smoke-graalpy.outcome == 'success'
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .graalpy/resources
        key: ${{ steps.java.outputs.graalpy-cache-primary-key }}
