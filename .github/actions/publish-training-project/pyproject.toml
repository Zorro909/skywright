[project]
name = "skywright-project-action"
version = "0.0.0"
requires-python = ">=3.10"
dependencies = [
  "skywright",
]

[dependency-groups]
dev = [
  "pyright>=1.1.403,<2",
  "pytest>=8.4,<10",
  "ruff>=0.12,<1",
]

[tool.uv]
required-version = "==0.8.8"

[tool.uv.sources]
skywright = { path = "../../../sdk" }

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
  "system: exercises the Action publication application boundary",
]

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I", "RUF", "SIM", "UP"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
