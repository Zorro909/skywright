name: Set up frontend toolchain
description: Install and cache the exact frontend prerequisites declared by the repository.
inputs:
  install-browser:
    description: Install Chromium and its operating-system dependencies
    required: false
    default: "false"
runs:
  using: composite
  steps:
    - name: Read the repository frontend toolchain
      id: toolchain
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path

        package = json.loads(Path("frontend/package.json").read_text())
        print(f"node_version={package['engines']['node']}")
        print(f"pnpm_version={package['packageManager'].removeprefix('pnpm@')}")
        print(f"playwright_version={package['devDependencies']['@playwright/test']}")
        PY
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ steps.toolchain.outputs.node_version }}
    - name: Set up pnpm
      shell: bash
      run: npm install --global "pnpm@${{ steps.toolchain.outputs.pnpm_version }}"
    - name: Locate the pnpm store
      id: pnpm-store
      shell: bash
      run: echo "path=$(pnpm --silent store path)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm downloads
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: ${{ runner.os }}-node-${{ steps.toolchain.outputs.node_version }}-pnpm-${{ steps.toolchain.outputs.pnpm_version }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
    - name: Install frontend dependencies
      shell: bash
      run: pnpm --dir frontend install --frozen-lockfile
    - name: Cache Playwright Chromium
      id: playwright-cache
      if: inputs.install-browser == 'true'
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-node-${{ steps.toolchain.outputs.node_version }}-pnpm-${{ steps.toolchain.outputs.pnpm_version }}-playwright-${{ steps.toolchain.outputs.playwright_version }}-${{ hashFiles('frontend/pnpm-lock.yaml') }}
    - name: Prefer the HTTPS Ubuntu package mirror
      if: inputs.install-browser == 'true'
      shell: bash
      run: |
        if [[ -f /etc/apt/apt-mirrors.txt ]]; then
          sudo sed -i \
            's|http://azure.archive.ubuntu.com/ubuntu/|https://archive.ubuntu.com/ubuntu/|g' \
            /etc/apt/apt-mirrors.txt
        fi
    - name: Install Chromium operating-system dependencies
      if: inputs.install-browser == 'true'
      shell: bash
      run: |
        echo "Installing Chromium operating-system dependencies (10 minute limit)"
        timeout --verbose --kill-after=30s 10m \
          pnpm --dir frontend exec playwright install-deps chromium
    - name: Install Playwright Chromium on cache miss
      if: inputs.install-browser == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        PLAYWRIGHT_DOWNLOAD_CONNECTION_TIMEOUT: "120000"
      run: |
        echo "Downloading Playwright Chromium ${{ steps.toolchain.outputs.playwright_version }} (10 minute limit)"
        timeout --verbose --kill-after=30s 10m \
          pnpm --dir frontend exec playwright install chromium
