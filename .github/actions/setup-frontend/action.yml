name: Set up frontend toolchain
description: Install the exact Node, pnpm, dependency, and Chromium prerequisites.
inputs:
  node-version:
    description: Exact supported Node version
    required: true
  pnpm-version:
    description: Exact supported pnpm version
    required: true
runs:
  using: composite
  steps:
    - name: Set up Node
      uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
      with:
        node-version: ${{ inputs.node-version }}
    - name: Set up pnpm
      shell: bash
      run: npm install --global "pnpm@${{ inputs.pnpm-version }}"
    - name: Install frontend and browser prerequisites
      shell: bash
      run: |
        pnpm --dir frontend install --frozen-lockfile
        pnpm --dir frontend exec playwright install --with-deps chromium
