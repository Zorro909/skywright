name: Set up Java toolchain
description: Download and install the repository's exact verified GraalVM Community toolchain.
inputs:
  graalpy-resources:
    description: Restore the exact packaged GraalPy environment when requested.
    required: false
    default: "false"
outputs:
  graalpy-cache-hit:
    description: Whether the exact packaged GraalPy environment was restored.
    value: ${{ steps.graalpy-cache.outputs.cache-hit }}
  graalpy-cache-primary-key:
    description: Exact key under which a validated packaged environment may be saved.
    value: ${{ steps.graalpy-cache.outputs.cache-primary-key }}
runs:
  using: composite
  steps:
    - name: Read the repository Java toolchain
      id: toolchain
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path

        toolchain = json.loads(Path("quality/toolchain.json").read_text())
        for name in ("java_archive_sha256", "java_archive_url", "java_version"):
            print(f"{name}={toolchain[name]}")
        PY
    - name: Cache GraalVM Community archive
      id: graalvm-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/graalvm-community.tar.gz
        key: ${{ runner.os }}-${{ runner.arch }}-graalvm-community-${{ steps.toolchain.outputs.java_archive_sha256 }}
    - name: Download exact GraalVM Community archive on cache miss
      if: steps.graalvm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JAVA_ARCHIVE_URL: ${{ steps.toolchain.outputs.java_archive_url }}
      run: |
        curl --fail --location --silent --show-error \
          --retry 5 --retry-delay 2 --retry-all-errors \
          --output "${RUNNER_TEMP}/graalvm-community.tar.gz" \
          "$JAVA_ARCHIVE_URL"
    - name: Verify GraalVM Community archive
      shell: bash
      env:
        JAVA_ARCHIVE_SHA256: ${{ steps.toolchain.outputs.java_archive_sha256 }}
      run: |
        echo "${JAVA_ARCHIVE_SHA256}  ${RUNNER_TEMP}/graalvm-community.tar.gz" \
          | sha256sum --check --strict
    - name: Set up GraalVM Community
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: jdkfile
        jdk-file: ${{ runner.temp }}/graalvm-community.tar.gz
        java-version: ${{ steps.toolchain.outputs.java_version }}
        cache: maven
    - name: Restore exact packaged GraalPy environment
      id: graalpy-cache
      if: inputs.graalpy-resources == 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .graalpy/resources
        key: ${{ runner.os }}-${{ runner.arch }}-ubuntu24-graalpy-env-v3-${{ steps.toolchain.outputs.java_archive_sha256 }}-${{ hashFiles('graalpy-environment/graalpy.lock', 'graalpy-environment/pom.xml', 'graalpy-environment/build-constraints.txt', 'backend-deployment/src/main/docker/Dockerfile') }}
