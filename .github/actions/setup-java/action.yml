name: Set up Java toolchain
description: Download and install the repository's exact verified GraalVM Community toolchain.
inputs:
  graalpy-resources:
    description: Restore the exact packaged GraalPy environment when requested.
    required: false
    default: "false"
outputs:
  graalpy-cache-hit:
    description: Whether the exact packaged GraalPy environment was restored.
    value: ${{ steps.graalpy-cache.outputs.cache-hit }}
  graalpy-cache-primary-key:
    description: Exact key under which a validated packaged environment may be saved.
    value: ${{ steps.graalpy-cache.outputs.cache-primary-key }}
  graalpy-wheel-identity:
    description: Exact native wheel inputs, independent of environment qualification code.
    value: ${{ steps.environment.outputs.wheel-identity }}
  graalpy-identity:
    description: Canonical effective environment identity, including inherited versions and native platform inputs.
    value: ${{ steps.environment.outputs.identity }}
runs:
  using: composite
  steps:
    - name: Read the repository Java toolchain
      id: toolchain
      shell: bash
      run: |
        python3 - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path

        toolchain = json.loads(Path("quality/toolchain.json").read_text())
        for name in ("java_archive_sha256", "java_archive_url"):
            print(f"{name}={toolchain[name]}")
        # setup-java accepts SemVer labels, but this JDK has a fourth hotfix component.
        # The archive checksum and Maven runtime checks still pin the exact JDK.
        parts = toolchain["java_version"].split(".")
        setup_version = ".".join(parts[:3])
        if len(parts) > 3:
            setup_version += "+" + ".".join(parts[3:])
        print(f"java_setup_version={setup_version}")
        PY
    - name: Cache GraalVM Community archive
      id: graalvm-cache
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ${{ runner.temp }}/graalvm-community.tar.gz
        key: ${{ runner.os }}-${{ runner.arch }}-graalvm-community-${{ steps.toolchain.outputs.java_archive_sha256 }}
    - name: Download exact GraalVM Community archive on cache miss
      if: steps.graalvm-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        JAVA_ARCHIVE_URL: ${{ steps.toolchain.outputs.java_archive_url }}
      run: |
        curl --fail --location --silent --show-error \
          --retry 5 --retry-delay 2 --retry-all-errors \
          --output "${RUNNER_TEMP}/graalvm-community.tar.gz" \
          "$JAVA_ARCHIVE_URL"
    - name: Verify GraalVM Community archive
      shell: bash
      env:
        JAVA_ARCHIVE_SHA256: ${{ steps.toolchain.outputs.java_archive_sha256 }}
      run: |
        echo "${JAVA_ARCHIVE_SHA256}  ${RUNNER_TEMP}/graalvm-community.tar.gz" \
          | sha256sum --check --strict
    - name: Set up GraalVM Community
      uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
      with:
        distribution: jdkfile
        jdk-file: ${{ runner.temp }}/graalvm-community.tar.gz
        java-version: ${{ steps.toolchain.outputs.java_setup_version }}
    - name: Cache Maven downloads
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: |
          ~/.m2/repository
          !~/.m2/repository/de/zorro909/skywright
        # Each lane saves its own dependency set; the native producer cannot win
        # a race and freeze an incomplete cache for every backend consumer.
        key: ${{ runner.os }}-${{ runner.arch }}-maven-v1-${{ github.job }}-${{ hashFiles('**/pom.xml', '.mvn/**') }}
        restore-keys: |
          ${{ runner.os }}-${{ runner.arch }}-maven-v1-${{ github.job }}-
    - name: Cache Maven wrapper distribution
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: ~/.m2/wrapper/dists
        key: ${{ runner.os }}-${{ runner.arch }}-maven-wrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
    - name: Resolve effective GraalPy environment identity
      id: environment
      if: inputs.graalpy-resources == 'true'
      shell: bash
      run: |
        scripts/graalpy-environment identity \
          --output .graalpy/expected-environment.json \
          --github-output "$GITHUB_OUTPUT"
    - name: Restore exact packaged GraalPy environment
      id: graalpy-cache
      if: inputs.graalpy-resources == 'true'
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
      with:
        path: .graalpy/resources
        key: ${{ runner.os }}-${{ runner.arch }}-graalpy-env-v4-${{ steps.environment.outputs.identity }}
