version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      graalpy-runtime:
        patterns:
          - 'org.graalvm*'
      spring:
        patterns:
          - 'org.springframework*'
      maven:
        patterns:
          - '*'
        exclude-patterns:
          - 'org.springframework*'
          - 'org.springframework.boot*'
          - 'org.graalvm*'

  - package-ecosystem: pip
    directory: /sdk
    schedule:
      interval: weekly
    groups:
      python-uv:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      angular-toolchain:
        patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
          - 'rxjs'
          - 'ng-openapi-gen'
      pnpm:
        patterns:
          - '*'
        exclude-patterns:
          - '@angular/*'
          - '@angular-devkit/*'
          - 'typescript'
          - 'rxjs'
          - 'ng-openapi-gen'
