apiVersion: v1
kind: Service
metadata:
  name: skywright-skypilot-api-server
  labels:
    app.kubernetes.io/name: skywright-skypilot-api-server
    app.kubernetes.io/part-of: skywright
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: skywright-skypilot-api-server
  ports:
    - name: http
      port: 46580
      targetPort: http
    - name: runtime-pull
      port: 46581
      targetPort: runtime-pull
    - name: log-collector
      port: 46582
      targetPort: log-collector
