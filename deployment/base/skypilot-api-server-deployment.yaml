apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywright-skypilot-api-server
  labels:
    app.kubernetes.io/name: skywright-skypilot-api-server
    app.kubernetes.io/part-of: skywright
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skywright-skypilot-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywright-skypilot-api-server
        app.kubernetes.io/part-of: skywright
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10002
        runAsGroup: 10002
        fsGroup: 10002
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      initContainers:
        - name: prepare-skypilot-rsync-helper
          image: skywright-skypilot-api-server
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 64Mi}
          command:
            - cp
            - /usr/local/lib/python3.12/site-packages/sky/utils/kubernetes/rsync_helper.sh
            - /runtime-helper/rsync_helper.sh
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: skypilot-rsync-helper
              mountPath: /runtime-helper
        - name: wait-for-skypilot-database
          image: skywright-skypilot-api-server
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: "1", memory: 64Mi}
          command:
            - python
            - -c
            - |
              import os
              import time

              import psycopg2

              while True:
                  try:
                      connection = psycopg2.connect(
                          os.environ["SKYPILOT_DB_CONNECTION_URI"],
                          connect_timeout=1,
                      )
                      connection.close()
                      break
                  except psycopg2.OperationalError:
                      time.sleep(1)
          env:
            - name: SKYPILOT_DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: skywright-skypilot-database
                  key: connectionUri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
      containers:
        - name: skypilot-api-server
          image: skywright-skypilot-api-server
          resources:
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "2"
              memory: 4Gi
          ports:
            - name: http
              containerPort: 46580
          env:
            - name: SKYPILOT_DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: skywright-skypilot-database
                  key: connectionUri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /api/health
              port: http
            failureThreshold: 120
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            periodSeconds: 5
          volumeMounts:
            # The unchanged SDK chmods this helper before each Kubernetes rsync.
            - name: skypilot-rsync-helper
              mountPath: /usr/local/lib/python3.12/site-packages/sky/utils/kubernetes/rsync_helper.sh
              subPath: rsync_helper.sh
            - name: temporary-files
              mountPath: /tmp
            - name: retained-state
              mountPath: /var/lib/skypilot
        - name: runtime-pull
          image: skywright-skypilot-api-server
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 256Mi
          command: ["python", "-I", "/opt/skywright/runtime/runtime_pull.py"]
          ports:
            - name: runtime-pull
              containerPort: 46581
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /health
              port: runtime-pull
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
        - name: log-collector
          image: skywright-skypilot-api-server
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          command: ["python", "-I", "/opt/skywright/runtime/log_collector.py"]
          ports:
            - name: log-collector
              containerPort: 46582
          env:
            - name: SKYPILOT_DB_CONNECTION_URI
              valueFrom:
                secretKeyRef:
                  name: skywright-skypilot-database
                  key: connectionUri
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          readinessProbe:
            httpGet:
              path: /health
              port: log-collector
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
            - name: retained-state
              mountPath: /var/lib/skypilot
              readOnly: true
      volumes:
        - name: skypilot-rsync-helper
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: retained-state
          persistentVolumeClaim:
            claimName: skywright-skypilot-state
