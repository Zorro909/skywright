apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywright-backend
  labels:
    app.kubernetes.io/name: skywright-backend
    app.kubernetes.io/part-of: skywright
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skywright-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywright-backend
        app.kubernetes.io/part-of: skywright
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      containers:
        - name: backend
          image: skywright-backend
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: SKYWRIGHT_DEPLOYMENT_ENVIRONMENT
              value: production
            - name: SKYWRIGHT_DATABASE_MIGRATION_URL
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: migrationUrl
            - name: SKYWRIGHT_DATABASE_MIGRATION_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: migrationUsername
            - name: SKYWRIGHT_DATABASE_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: migrationPassword
            - name: SKYWRIGHT_DATABASE_RUNTIME_URL
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: runtimeUrl
            - name: SKYWRIGHT_DATABASE_RUNTIME_USERNAME
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: runtimeUsername
            - name: SKYWRIGHT_DATABASE_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-database
                  key: runtimePassword
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
          startupProbe:
            httpGet:
              path: /livez
              port: http
            failureThreshold: 30
            periodSeconds: 2
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          volumeMounts:
            - name: temporary-files
              mountPath: /tmp
      volumes:
        - name: temporary-files
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
