apiVersion: batch/v1
kind: Job
metadata:
  name: skywright-local-skypilot-database-provisioner
  labels:
    app.kubernetes.io/name: skywright-local-skypilot-database-provisioner
    app.kubernetes.io/part-of: skywright
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywright-local-skypilot-database-provisioner
        app.kubernetes.io/part-of: skywright
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 10003
        runAsGroup: 10003
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provision-database
          image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
          command:
            - sh
            - -c
            - |
              until pg_isready --host skywright-postgresql --port 5432 --username postgres; do sleep 1; done
              psql --set=ON_ERROR_STOP=1 \
                --host=skywright-postgresql \
                --username=postgres \
                --dbname=postgres \
                --set=skypilot_password="$SKYPILOT_DATABASE_PASSWORD" <<'SQL'
              GRANT CONNECT, CREATE ON DATABASE skywright TO skywright_migration;
              GRANT CONNECT ON DATABASE skywright TO skywright_runtime;
              SELECT format('CREATE ROLE skypilot LOGIN PASSWORD %L', :'skypilot_password')
                WHERE NOT EXISTS (SELECT FROM pg_roles WHERE rolname = 'skypilot')\gexec
              SELECT format('ALTER ROLE skypilot PASSWORD %L', :'skypilot_password')\gexec
              SELECT 'CREATE DATABASE skypilot OWNER skypilot'
                WHERE NOT EXISTS (SELECT FROM pg_database WHERE datname = 'skypilot')\gexec
              ALTER DATABASE skypilot OWNER TO skypilot;
              SQL
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-local-database
                  key: administratorPassword
            - name: SKYPILOT_DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-local-skypilot-database
                  key: password
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
