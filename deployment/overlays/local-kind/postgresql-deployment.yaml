apiVersion: apps/v1
kind: Deployment
metadata:
  name: skywright-postgresql
  labels:
    app.kubernetes.io/name: skywright-postgresql
    app.kubernetes.io/part-of: skywright
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: skywright-postgresql
  template:
    metadata:
      labels:
        app.kubernetes.io/name: skywright-postgresql
        app.kubernetes.io/part-of: skywright
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgresql
          image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
          env:
            - name: POSTGRES_DB
              value: skywright
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-local-database
                  key: administratorPassword
            - name: SKYWRIGHT_MIGRATION_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-local-database
                  key: migrationPassword
            - name: SKYWRIGHT_RUNTIME_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: skywright-local-database
                  key: runtimePassword
          ports:
            - name: postgresql
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--username", "postgres", "--dbname", "skywright"]
            periodSeconds: 2
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initialization
              mountPath: /docker-entrypoint-initdb.d
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: skywright-postgresql-data
        - name: initialization
          configMap:
            name: skywright-postgresql-init
            defaultMode: 0555
---
apiVersion: v1
kind: Service
metadata:
  name: skywright-postgresql
  labels:
    app.kubernetes.io/name: skywright-postgresql
    app.kubernetes.io/part-of: skywright
spec:
  selector:
    app.kubernetes.io/name: skywright-postgresql
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
