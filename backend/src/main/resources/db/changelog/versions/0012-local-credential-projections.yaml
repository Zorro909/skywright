databaseChangeLog:
  - changeSet:
      id: issue-229-local-credential-projections
      author: skywright
      changes:
        - createTable:
            schemaName: skywright
            tableName: local_credential_projection
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: consumer_id, type: uuid, constraints: { nullable: false } }
              - column: { name: slot, type: varchar(32), constraints: { nullable: false } }
              - column: { name: binding_id, type: uuid, constraints: { nullable: false } }
              - column: { name: binding_revision, type: bigint, constraints: { nullable: false } }
              - column: { name: consumer_role, type: varchar(64), constraints: { nullable: false } }
              - column: { name: projected_at, type: timestamp with time zone, constraints: { nullable: false } }
        - addUniqueConstraint: { schemaName: skywright, tableName: local_credential_projection, columnNames: 'consumer_id, slot', constraintName: uq_local_projection_consumer_slot }
        - createTable:
            schemaName: skywright
            tableName: local_credential_release
            columns:
              - column: { name: consumer_id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: released_at, type: timestamp with time zone, constraints: { nullable: false } }
        - sql:
            sql: GRANT SELECT, INSERT ON skywright.local_credential_projection, skywright.local_credential_release TO "${runtimeRole}"
      rollback:
        - dropTable: { schemaName: skywright, tableName: local_credential_release }
        - dropTable: { schemaName: skywright, tableName: local_credential_projection }
