databaseChangeLog:
  - changeSet:
      id: issue-175-eligible-gpu-offering-catalogue
      author: skywright
      logicalFilePath: db/changelog/versions/0009-eligible-gpu-offering-catalogue.yaml
      changes:
        - createTable:
            tableName: eligible_gpu_offering
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: revision, type: bigint, constraints: { nullable: false } }
              - column: { name: target_class, type: varchar(32), constraints: { nullable: false } }
              - column: { name: target, type: varchar(255), constraints: { nullable: false } }
              - column: { name: provider_offering_id, type: varchar(255), constraints: { nullable: false } }
              - column: { name: region, type: varchar(255), constraints: { nullable: false } }
              - column: { name: instance_type, type: varchar(255), constraints: { nullable: false } }
              - column: { name: gpu_model, type: varchar(255), constraints: { nullable: false } }
              - column: { name: gpu_count, type: integer, constraints: { nullable: false } }
              - column: { name: gpu_memory_bytes, type: bigint, constraints: { nullable: false } }
              - column: { name: purchase_mode, type: varchar(32), constraints: { nullable: false } }
              - column: { name: support_tier, type: varchar(32), constraints: { nullable: false } }
              - column: { name: persistence_version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - sql:
            sql: GRANT SELECT, INSERT, UPDATE, DELETE ON eligible_gpu_offering TO "${runtimeRole}"
      rollback:
        - sql:
            sql: REVOKE ALL PRIVILEGES ON eligible_gpu_offering FROM "${runtimeRole}"
        - dropTable: { tableName: eligible_gpu_offering }
        - sql:
            comment: Restore the application schema for earlier raw-SQL rollbacks.
            sql: SET search_path TO skywright
