databaseChangeLog:
  - changeSet:
      id: issue-80-target-storage-registry
      author: skywright
      logicalFilePath: db/changelog/versions/0002-target-storage-registry.yaml
      changes:
        - createTable:
            tableName: target_storage
            columns:
              - column: { name: id, type: uuid, constraints: { primaryKey: true, nullable: false } }
              - column: { name: name, type: varchar(255), constraints: { nullable: false } }
              - column: { name: purpose, type: varchar(32), constraints: { nullable: false } }
              - column: { name: bucket, type: varchar(255), constraints: { nullable: false } }
              - column: { name: registration_revision, type: bigint, constraints: { nullable: false } }
              - column: { name: activated, type: boolean, constraints: { nullable: false } }
              - column: { name: active_revision, type: bigint }
              - column: { name: candidate_revision, type: bigint }
              - column: { name: availability, type: varchar(32), constraints: { nullable: false } }
              - column: { name: persistence_version, type: bigint, defaultValueNumeric: 0, constraints: { nullable: false } }
        - createTable:
            tableName: target_storage_configuration
            columns:
              - column: { name: target_storage_id, type: uuid, constraints: { nullable: false } }
              - column: { name: configuration_order, type: integer, constraints: { nullable: false } }
              - column: { name: encoded_configuration, type: varchar(8192), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: target_storage_configuration, baseColumnNames: target_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_configuration_storage, onDelete: CASCADE }
        - createTable:
            tableName: target_storage_binding
            columns:
              - column: { name: target_storage_id, type: uuid, constraints: { nullable: false } }
              - column: { name: binding_order, type: integer, constraints: { nullable: false } }
              - column: { name: encoded_binding, type: varchar(4096), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: target_storage_binding, baseColumnNames: target_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_binding_storage, onDelete: CASCADE }
        - createTable:
            tableName: target_storage_assessment
            columns:
              - column: { name: target_storage_id, type: uuid, constraints: { nullable: false } }
              - column: { name: assessment_order, type: integer, constraints: { nullable: false } }
              - column: { name: encoded_assessment, type: varchar(65535), constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: target_storage_assessment, baseColumnNames: target_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_assessment_storage, onDelete: CASCADE }
        - createTable:
            tableName: target_storage_resource
            columns:
              - column: { name: target_storage_id, type: uuid, constraints: { nullable: false } }
              - column: { name: resource_key, type: varchar(4096), constraints: { nullable: false, unique: true, uniqueConstraintName: uk_target_storage_resource_key } }
        - addForeignKeyConstraint: { baseTableName: target_storage_resource, baseColumnNames: target_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_resource_storage, onDelete: CASCADE }
        - createTable:
            tableName: target_storage_defaults
            columns:
              - column: { name: target_class, type: varchar(32), constraints: { primaryKey: true, nullable: false } }
              - column: { name: execution_storage_id, type: uuid, constraints: { nullable: false } }
              - column: { name: repatriation_enabled, type: boolean, constraints: { nullable: false } }
              - column: { name: repatriation_storage_id, type: uuid, constraints: { nullable: false } }
        - addForeignKeyConstraint: { baseTableName: target_storage_defaults, baseColumnNames: execution_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_defaults_execution }
        - addForeignKeyConstraint: { baseTableName: target_storage_defaults, baseColumnNames: repatriation_storage_id, referencedTableName: target_storage, referencedColumnNames: id, constraintName: fk_target_storage_defaults_repatriation }
        - sqlFile:
            path: ../sql/0002-target-storage-grants.sql
            relativeToChangelogFile: true
      rollback:
        - sqlFile:
            path: ../sql/0002-target-storage-grants-rollback.sql
            relativeToChangelogFile: true
        - dropTable: { tableName: target_storage_defaults }
        - dropTable: { tableName: target_storage_resource }
        - dropTable: { tableName: target_storage_assessment }
        - dropTable: { tableName: target_storage_binding }
        - dropTable: { tableName: target_storage_configuration }
        - dropTable: { tableName: target_storage }
