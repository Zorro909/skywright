spring.application.name=skywright-backend
spring.application.version=@project.version@
spring.main.banner-mode=off
spring.threads.virtual.enabled=false
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

skywright.skypilot.bridge.control-queue-capacity=8
skywright.skypilot.bridge.held-queue-capacity=4
skywright.skypilot.bridge.shutdown-grace=20s
skywright.skypilot.bridge.availability-probe-interval=30s
skywright.skypilot.bridge.external-directory=graalpy-resources

spring.datasource.url=${SKYWRIGHT_DATABASE_RUNTIME_URL}
spring.datasource.username=${SKYWRIGHT_DATABASE_RUNTIME_USERNAME}
spring.datasource.password=${SKYWRIGHT_DATABASE_RUNTIME_PASSWORD}
spring.datasource.hikari.connection-timeout=2000
spring.datasource.hikari.validation-timeout=2000
spring.datasource.hikari.initialization-fail-timeout=5000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.data-source-properties.connectTimeout=5
spring.datasource.hikari.data-source-properties.socketTimeout=5
spring.datasource.hikari.data-source-properties.tcpKeepAlive=true
spring.data.jpa.repositories.enable-default-transactions=false
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=skywright
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.liquibase.change-log=classpath:/db/changelog/db.changelog-master.yaml
spring.liquibase.url=${SKYWRIGHT_DATABASE_MIGRATION_URL}
spring.liquibase.user=${SKYWRIGHT_DATABASE_MIGRATION_USERNAME}
spring.liquibase.password=${SKYWRIGHT_DATABASE_MIGRATION_PASSWORD}
spring.liquibase.default-schema=skywright
spring.liquibase.liquibase-schema=skywright
spring.liquibase.parameters.runtimeRole=${spring.datasource.username}

logging.structured.format.console=ecs
logging.structured.ecs.service.name=${spring.application.name}
logging.structured.ecs.service.version=${spring.application.version}

management.endpoints.access.default=none
management.endpoint.health.access=read-only
management.endpoint.info.access=read-only
management.endpoints.web.exposure.include=health,info
management.endpoints.jmx.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.additional-path=server:/livez
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.additional-path=server:/readyz
management.endpoint.health.group.readiness.include=readinessState,db,schemaCompatibility
